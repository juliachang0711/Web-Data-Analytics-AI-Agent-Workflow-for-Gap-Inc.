    - data:
        code: "import json, math\nfrom datetime import datetime, timezone\n\ndef main(tiktok_raw):\n\
          \    \"\"\"Compute TikTok momentum score from Apify HTTP JSON body.\"\"\"\
          \n    # 1️⃣ Parse the raw text body\n    try:\n        data = json.loads(tiktok_raw)\n\
          \    except Exception:\n        return {\"momentum_score\": 0.0, \"error\"\
          : \"Invalid JSON\"}\n\n    # 2️⃣ Validate data structure\n    if not isinstance(data,\
          \ list) or len(data) == 0:\n        return {\"momentum_score\": 0.0}\n\n\
          \    # 3️⃣ Calculate engagement within recent 30 days\n    now = datetime.now(timezone.utc).timestamp()\n\
          \    window = 30 * 24 * 3600\n    total = count = 0\n\n    for v in data:\n\
          \        try:\n            ct = int(v.get(\"createTime\", 0))\n        except\
          \ Exception:\n            continue\n\n        if 0 <= (now - ct) <= window:\n\
          \            likes = v.get(\"diggCount\", 0) or 0\n            comments\
          \ = v.get(\"commentCount\", 0) or 0\n            shares = v.get(\"shareCount\"\
          , 0) or 0\n            total += likes + comments + shares\n            count\
          \ += 1\n\n    if count == 0:\n        return {\"momentum_score\": 0.0}\n\
          \n    avg = total / count\n    score = 1 - math.exp(-avg / 5000.0)\n   \
          \ score = round(min(max(score, 0.0), 1.0), 3)\n\n    # 4️⃣ Return final\
          \ score\n    return {\"momentum_score\": score}\n"
