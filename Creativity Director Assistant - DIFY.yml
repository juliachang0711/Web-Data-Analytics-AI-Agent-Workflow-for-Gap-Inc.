    - data:
        code: "import os, math, time, requests, re\nfrom datetime import datetime,\
          \ timezone\n\n\n# ----------------------------\n# CONFIG\n# ----------------------------\n\
          UA = \"Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)\"\nSERPAPI_ENDPOINT\
          \ = \"https://serpapi.com/search\"\nAPIFY_TIKTOK_ACTOR = \"your api\"\
          \n\n# ----------------------------\n# HELPERS\n# ----------------------------\n\
          \ndef moving_avg(x, w=3):\n    \"\"\"Simple moving average to smooth noisy\
          \ trend data.\"\"\"\n    return [sum(x[max(0, i - w + 1):i + 1]) / len(x[max(0,\
          \ i - w + 1):i + 1]) for i in range(len(x))]\n\ndef detect_peak_and_saturation(series):\n\
          \    \"\"\"Compute saturation score from normalized Google Trends series.\"\
          \"\"\n    if not series:\n        return {\"peak_value\": 0, \"derivative\"\
          : 0, \"saturation_score\": 0}\n\n    ma = moving_avg(series)\n    n = len(ma)\n\
          \    peak_idx = max(range(n), key=lambda i: ma[i])\n    peak_val = ma[peak_idx]\n\
          \n    # average derivative for next 3 data points\n    after = ma[peak_idx\
          \ + 1:peak_idx + 4]\n    if after:\n        diffs = [after[i] - ma[peak_idx\
          \ + i] for i in range(len(after))]\n        deriv = sum(diffs) / len(diffs)\n\
          \    else:\n        deriv = 0.0\n\n    level = peak_val / 100.0\n    flat_or_down\
          \ = 1.0 if deriv <= 0 else max(0.0, 1.0 - deriv / 10.0)\n    last_val =\
          \ ma[-1]\n    plateau = max(0.0, 1.0 - abs(peak_val - last_val) / 100.0)\n\
          \n    score = round(0.5 * level + 0.3 * flat_or_down + 0.2 * plateau, 3)\n\
          \    return {\n        \"peak_value\": round(peak_val, 3),\n        \"derivative\"\
          : round(deriv, 3),\n        \"saturation_score\": score\n    }\n\ndef serpapi_timeseries(term,\
          \ region, timeframe, api_key):\n    \"\"\"Fetch normalized time series data\
          \ from SerpAPI Google Trends.\"\"\"\n    params = {\n        \"engine\"\
          : \"google_trends\",\n        \"q\": term,\n        \"data_type\": \"TIMESERIES\"\
          ,\n        \"geo\": region,\n        \"date\": timeframe,\n        \"api_key\"\
          : api_key\n    }\n    try:\n        r = requests.get(SERPAPI_ENDPOINT, params=params,\
          \ timeout=20)\n        if r.status_code != 200:\n            return []\n\
          \        data = r.json()\n        timeline = data.get(\"interest_over_time\"\
          , {}).get(\"timeline_data\", [])\n        return [int(v[\"values\"][0][\"\
          value\"]) for v in timeline if \"values\" in v]\n    except Exception:\n\
          \        return []\n\n\n# ----------------------------\n# MAIN FUNCTION\n\
          # ----------------------------\ndef main(term: str, region: str, timeframe:\
          \ str,momentum_score):\n    serp_key = os.environ.get(\"SERPAPI_KEY\") "\n\
          \n    # --- Google Trends ---\n    try:\n        series = serpapi_timeseries(term,\
          \ region, timeframe, serp_key)\n        sat = detect_peak_and_saturation(series)\n\
          \    except Exception:\n        sat = {\"peak_value\": 0, \"derivative\"\
          : 0, \"saturation_score\": 0}\n\n        visual_score = 0.0\n\n    # ---\
          \ Competitor intensity ---\n    try:\n        comp = competitor_intensity(term)\n\
          \    except Exception:\n        comp = 0.0\n\n    # --- TikTok momentum\
          \ ---\n    try:\n        momentum = tiktok_momentum(term)\n    except Exception:\n\
          \        momentum = 0.0\n\n    # --- Consolidated output ---\n    return\
          \ {\n        \"term_data\": {\n            \"term\": term,\n           \
          \ \"peak_value\": sat[\"peak_value\"],\n            \"derivative_after_peak\"\
          : sat[\"derivative\"],\n            \"saturation_score\": sat[\"saturation_score\"\
          ],\n            \"momentum_score\":momentum_score,\n        }\n    }\n"
        code_language: python3
